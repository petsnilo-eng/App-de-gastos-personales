<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Finanzas de Walter &amp; Olin</title>
    <style>
      :root { color-scheme: dark; }
      * { -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; background: #0B0F14; }

      /* Celular: la app ocupa todo */
      .app-frame {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;   /* descuenta la barra del navegador en iOS/Android */
        overflow: hidden;
        background: #0B0F14;
        color: #F1F5F4;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      /* Pantalla grande: la mostramos como un teléfono centrado */
      @media (min-width: 560px) {
        body { background: #05080B; }
        #root {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100dvh;
          padding: 20px;
          box-sizing: border-box;
        }
        .app-frame {
          max-width: 420px;
          height: 800px;
          min-height: 0;
          border: 1px solid #232D3A;
          border-radius: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
